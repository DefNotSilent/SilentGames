       <script>
        document.addEventListener('DOMContentLoaded', function() {
            const setkeybind = document.getElementById('setkeybind');
            const output = document.getElementById('output');
            let keybind = localStorage.getItem('keybind') || 'none'; 
    
            output.textContent = `Current key: ${keybind}`;
    
            setkeybind.addEventListener('click', () => {
                output.textContent = 'Listening...';
                document.removeEventListener('keydown', keydownHandler);
                document.addEventListener('keydown', keydownHandler);
            });
    
            function keydownHandler(event) {
                keybind = event.key;
                localStorage.setItem('keybind', keybind);
                output.textContent = `Selected Key: ${keybind}`;
                document.removeEventListener('keydown', keydownHandler);
                location.reload()
            }
        });
    </script>
    
    <script>
       // Define global variables
var win;

// 1. About:Blank disguise Function
function openAbdisguise() {
    const url = window.location.href;
    if (win) {
        win.focus();
    } else {
        win = window.open();
        win.document.body.style.margin = '0';
        win.document.body.style.height = '100vh';
        var iframe = win.document.createElement('iframe');
        Object.assign(iframe.style, {
            border: 'none', width: '100%', height: '100%', margin: '0'
        });
        iframe.src = url;
        win.document.body.appendChild(iframe);
        window.location.replace("https://www.khanacademy.org");
    }
}

// 2. Data URL Link Function (NightByte Premium Style)
function datalink() {
    const html = `<!DOCTYPE html><html><head><title>Home | Schoology</title><style>body,html{margin:0;padding:0;height:100%;overflow:hidden;}iframe{border:none;width:100%;height:100%;}</style></head><body><iframe src="${window.location.href}"></iframe></body></html>`;
    const dataUrl = `data:text/html;charset=utf-8,${encodeURIComponent(html)}`;

    // Get current theme color from NightByte variables
    const themeColor = getComputedStyle(document.documentElement).getPropertyValue('--primary-color').trim() || '#ffffff';

    // Create Modal Overlay (Heavy Blur)
    const modal = document.createElement('div');
    Object.assign(modal.style, {
        position: 'fixed', top: '0', left: '0', width: '100vw', height: '100vh',
        backgroundColor: 'rgba(0, 0, 0, 0.6)', backdropFilter: 'blur(15px)',
        webkitBackdropFilter: 'blur(15px)', zIndex: '1000000', 
        display: 'flex', justifyContent: 'center', alignItems: 'center',
        opacity: '0', transition: 'opacity 0.3s ease'
    });

    // Content Box (Glassmorphism)
    const contentBox = document.createElement('div');
    Object.assign(contentBox.style, {
        backgroundColor: 'rgba(20, 20, 20, 0.8)',
        padding: '40px', borderRadius: '24px',
        border: `1px solid rgba(255, 255, 255, 0.1)`,
        boxShadow: `0 25px 50px rgba(0,0,0,0.5), 0 0 15px ${themeColor}22`,
        position: 'relative', width: '90%', maxWidth: '500px',
        textAlign: 'center', fontFamily: "'Fredoka', sans-serif", color: '#fff',
        transform: 'scale(0.9)', transition: 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)'
    });

    contentBox.innerHTML = `
        <button id="close-modal" style="position:absolute; top:20px; right:20px; background:none; border:none; color:#fff; font-size:24px; cursor:pointer; opacity:0.5; transition:0.2s;">&times;</button>
        <div style="width: 50px; height: 50px; background: ${themeColor}; color: #000; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 24px; box-shadow: 0 0 20px ${themeColor}66;">
            <i class="fa-solid fa-link"></i>
        </div>
        <h2 style="color:#fff; font-size: 24px; margin-bottom:8px; letter-spacing: -0.5px;">Stealth Link Ready</h2>
        <p style="color: rgba(255,255,255,0.5); font-size:15px; margin-bottom:25px;">Copy this link to open a stealth tab that stays hidden from history.</p>
        
        <div style="background: rgba(0,0,0,0.4); padding: 8px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); display:flex; gap:10px; align-items: center;">
            <input type="text" id="data-url-input" value="${dataUrl}" readonly style="flex:1; padding:10px 15px; border:none; background:transparent; color:#fff; font-size:14px; outline:none; font-family: monospace; opacity: 0.8;">
            <button id="copy-data-btn" style="padding:12px 25px; border-radius:10px; border:none; background:${themeColor}; color:#000; font-weight:bold; cursor:pointer; font-family: 'Fredoka', sans-serif; transition: 0.3s; white-space: nowrap;">Copy Link</button>
        </div>
    `;

    modal.appendChild(contentBox);
    document.body.appendChild(modal);

    // Trigger Animation
    setTimeout(() => {
        modal.style.opacity = '1';
        contentBox.style.transform = 'scale(1)';
    }, 10);

    // Functionality
    const closeModal = () => {
        modal.style.opacity = '0';
        contentBox.style.transform = 'scale(0.9)';
        setTimeout(() => document.body.removeChild(modal), 300);
    };

    document.getElementById('close-modal').onclick = closeModal;
    modal.onclick = (e) => { if (e.target === modal) closeModal(); };
    
    const copyBtn = document.getElementById('copy-data-btn');
    copyBtn.onclick = () => {
        const input = document.getElementById('data-url-input');
        input.select();
        document.execCommand('copy');
        copyBtn.textContent = 'Copied!';
        copyBtn.style.boxShadow = `0 0 20px ${themeColor}`;
        setTimeout(() => { 
            copyBtn.textContent = 'Copy Link'; 
            copyBtn.style.boxShadow = 'none';
        }, 2000);
    };

    // Close Modal hover effect
    const closeX = document.getElementById('close-modal');
    closeX.onmouseover = () => closeX.style.opacity = '1';
    closeX.onmouseout = () => closeX.style.opacity = '0.5';
}

// 3. Initialization
document.addEventListener('DOMContentLoaded', () => {
    const abBtn = document.querySelector('#abdisguise');
    if (abBtn) abBtn.onclick = openAbdisguise;
});
    </script>
